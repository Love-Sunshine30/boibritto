openapi: 3.0.3

info:
  title: Boibritto API
  version: 1.0.0
  description: |
    HTTP API for Boibritto, a peer-to-peer book-sharing platform.
    All /api/v1 endpoints require a Firebase ID token in the Authorization header.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Health
  - name: Books
  - name: Borrow Requests
  - name: Profile
  - name: Messages
  - name: Push Notifications
  - name: Forum
  - name: Admin

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check API and database health
      security: []
      responses:
        "200":
          description: API and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessHealthResponse"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /books:
    get:
      tags: [Books]
      summary: List books
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Case-insensitive partial match against title or author
          schema:
            type: string
        - name: genre
          in: query
          description: Case-insensitive exact genre filter
          schema:
            type: string
      responses:
        "200":
          description: Book list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Books]
      summary: Create a book listing
      description: The authenticated user's profile must be complete, including a WhatsApp number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookRequest"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /books/{id}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Books]
      summary: Get a book
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Books]
      summary: Update a book
      description: Only the owner of the book can update it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookRequest"
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Books]
      summary: Delete a book
      description: Only the owner of the book can delete it.
      responses:
        "204":
          description: Book deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /books/{id}/requests:
    parameters:
      - $ref: "#/components/parameters/BookId"
    post:
      tags: [Borrow Requests]
      summary: Request to borrow a book
      description: The requester cannot request their own book and cannot have another pending request for the same book.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestBody"
      responses:
        "201":
          description: Borrow request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowRequestEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /requests/sent:
    get:
      tags: [Borrow Requests]
      summary: List requests sent by the current user
      responses:
        "200":
          description: Sent requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowRequestListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /requests/incoming:
    get:
      tags: [Borrow Requests]
      summary: List requests received by the current user
      responses:
        "200":
          description: Incoming requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowRequestListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /requests/{id}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    patch:
      tags: [Borrow Requests]
      summary: Accept or reject a borrow request
      description: Only the book owner can change a pending request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Updated borrow request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowRequestEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /requests/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Borrow Requests]
      summary: Confirm a handoff
      description: Either the owner or borrower can confirm. When both confirm, the request becomes active and the book becomes unavailable.
      responses:
        "200":
          description: Updated borrow request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowRequestEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /requests/{id}/return:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Borrow Requests]
      summary: Mark a borrowed book as returned
      description: Only the book owner can mark an active request as returned.
      responses:
        "200":
          description: Updated borrow request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BorrowRequestEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /me:
    get:
      tags: [Profile]
      summary: Get the current user's profile
      responses:
        "200":
          description: Current user's profile, books, and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Profile]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Profile]
      summary: Get a public user profile
      responses:
        "200":
          description: Public profile, books, and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfileEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /threads:
    get:
      tags: [Messages]
      summary: List the current user's message threads
      responses:
        "200":
          description: Message thread summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /threads/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Messages]
      summary: Send a message in a borrow-request thread
      description: The authenticated user must be a participant in the thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /push/subscribe:
    post:
      tags: [Push Notifications]
      summary: Register an FCM device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "204":
          description: Subscription saved
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /push/unsubscribe:
    post:
      tags: [Push Notifications]
      summary: Remove an FCM device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeRequest"
      responses:
        "204":
          description: Subscription removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /books/{id}/forum:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Forum]
      summary: List forum posts for a book
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Forum posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumListEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Forum]
      summary: Create a forum post for a book
      description: The authenticated user's profile must be complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Forum post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /forum/{postID}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    patch:
      tags: [Forum]
      summary: Edit a forum post
      description: Only the author of the post can edit it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Updated forum post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Forum]
      summary: Delete a forum post
      description: Only the author of the post can delete it.
      responses:
        "204":
          description: Post deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/books/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/BookId"
    patch:
      tags: [Admin]
      summary: Set a book cover URL
      description: Requires an authenticated user with admin privileges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCoverRequest"
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token

  parameters:
    BookId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    PostId:
      name: postID
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    Cursor:
      name: cursor
      in: query
      description: RFC3339 timestamp used for cursor pagination.
      schema:
        type: string
        format: date-time

  responses:
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing, malformed, invalid, or expired Firebase ID token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated user is not allowed to perform the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Request conflicts with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ResponseEnvelope:
      type: object
      properties:
        data: {}

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"

    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples:
            - validation_failed
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - internal_error
            - "too many request"
        message:
          type: string

    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, database]
          properties:
            status:
              type: string
              enum: [ok, unhealthy]
            database:
              type: string
              enum: [ok, unreachable]

    SuccessHealthResponse:
      allOf:
        - $ref: "#/components/schemas/HealthResponse"

    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        whatsapp_number:
          type: string
          nullable: true
        last_active_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        last_active_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    UserBookSummary:
      type: object
      required: [id, title, author, cover_url, available]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        cover_url:
          type: string
        available:
          type: boolean

    ActivityItem:
      type: object
      required: [type, description, timestamp]
      properties:
        type:
          type: string
          enum: [book_listed, request_sent, request_accepted]
        description:
          type: string
        timestamp:
          type: string
          format: date-time

    OwnProfile:
      type: object
      required: [user, books, recent_activity]
      properties:
        user:
          $ref: "#/components/schemas/User"
        books:
          type: array
          items:
            $ref: "#/components/schemas/UserBookSummary"
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    PublicProfile:
      type: object
      required: [user, books, recent_activity]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        books:
          type: array
          items:
            $ref: "#/components/schemas/UserBookSummary"
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    Book:
      type: object
      required:
        - id
        - title
        - author
        - genre
        - description
        - cover_url
        - available
        - owner_id
        - owner_name
        - created_at
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        description:
          type: string
        cover_url:
          type: string
        available:
          type: boolean
        owner_id:
          type: integer
        owner_name:
          type: string
        created_at:
          type: string
          format: date-time

    CreateBookRequest:
      type: object
      required: [title, author]
      properties:
        title:
          type: string
          maxLength: 200
        author:
          type: string
        genre:
          type: string
        description:
          type: string
          maxLength: 2000
        cover_url:
          type: string

    UpdateBookRequest:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        description:
          type: string
        cover_url:
          type: string
        available:
          type: boolean

    BorrowRequest:
      type: object
      required:
        - id
        - book_id
        - book_title
        - requester_id
        - requester_name
        - message
        - owner_id
        - status
        - owner_confirmed
        - borrower_confirmed
        - created_at
      properties:
        id:
          type: integer
        book_id:
          type: integer
        book_title:
          type: string
        requester_id:
          type: integer
        requester_name:
          type: string
        message:
          type: string
        owner_id:
          type: integer
        status:
          type: string
          enum: [pending, accepted, active, rejected, returned]
        owner_confirmed:
          type: boolean
        borrower_confirmed:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateRequestBody:
      type: object
      properties:
        message:
          type: string
          maxLength: 500

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected]

    ThreadSummary:
      type: object
      required: [request_id, book_title, last_message_preview, last_message_at]
      properties:
        request_id:
          type: integer
        book_title:
          type: string
        other_participant_name:
          type: string
        last_message_preview:
          type: string
        last_message_at:
          type: string
          format: date-time

    Message:
      type: object
      required: [sender_id, body, created_at]
      properties:
        sender_id:
          type: integer
        body:
          type: string
        created_at:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    SubscribeRequest:
      type: object
      required: [platform, fcm_token]
      properties:
        platform:
          type: string
          enum: [web, android]
        fcm_token:
          type: string
          minLength: 1

    UnsubscribeRequest:
      type: object
      required: [fcm_token]
      properties:
        fcm_token:
          type: string

    Post:
      type: object
      required: [id, book_id, user_id, user_name, body, edited, created_at]
      properties:
        id:
          type: integer
        book_id:
          type: integer
        user_id:
          type: integer
        user_name:
          type: string
        body:
          type: string
        edited:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreatePostRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 3000

    UpdatePostRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1

    SetCoverRequest:
      type: object
      required: [cover_url]
      properties:
        cover_url:
          type: string

    BookListData:
      type: object
      required: [books]
      properties:
        books:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        next_cursor:
          type: string
          format: date-time
          nullable: true

    BorrowRequestListData:
      type: array
      items:
        $ref: "#/components/schemas/BorrowRequest"

    ForumListData:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        next_cursor:
          type: string
          format: date-time
          nullable: true

    BookEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Book"

    BookListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/BookListData"

    BorrowRequestEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/BorrowRequest"

    BorrowRequestListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/BorrowRequestListData"

    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"

    OwnProfileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/OwnProfile"

    PublicProfileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PublicProfile"

    ThreadListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ThreadSummary"

    MessageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Message"

    PostEnvelope:
